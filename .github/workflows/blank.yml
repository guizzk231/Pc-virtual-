name: PC Virtual Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Defina uma senha para o usuário'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Servidor de Área de Trabalho e Ferramentas
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver

      - name: Instalar Ngrok
        uses: ngrok/ngrok-actions@v1
        with:
          authtoken: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Iniciar Servidor VNC
        run: |
          vncserver -geometry 1280x720 -depth 24
          echo "VNC iniciado na porta 5901"

      - name: Conectar VNC via Ngrok (TCP)
        run: |
          ngrok tcp 5901 &

      - name: Manter a Máquina Ativa
        run: |
          echo "PC Virtual pronto! Use um cliente VNC para conectar."
          sleep infinity
          

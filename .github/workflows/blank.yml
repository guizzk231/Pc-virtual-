
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu PC Virtual</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
  background: #071a38;
}

.desktop {
  height: 100dvh;
  padding: 18px;
  padding-bottom: 65px;
  background:
    radial-gradient(ellipse at 75% 30%, #1687d4, transparent 40%),
    linear-gradient(135deg, #07152f, #123c78, #07152f);
}

.icon {
  width: 85px;
  padding: 12px 4px;
  text-align: center;
  cursor: pointer;
  border-radius: 8px;
  font-size: 13px;
  user-select: none;
}

.icon:hover { background: #ffffff30; }

.emoji {
  display: block;
  font-size: 35px;
  margin-bottom: 8px;
}

.taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 55px;
  background: #101a2deF;
  backdrop-filter: blur(15px);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 15px;
  z-index: 1000;
}

.taskbutton {
  border: 0;
  background: transparent;
  color: white;
  font-size: 24px;
  cursor: pointer;
  padding: 8px;
  border-radius: 7px;
}

.taskbutton:hover { background: #ffffff25; }

#clock {
  margin-left: auto;
  text-align: right;
  font-size: 12px;
  line-height: 1.6;
}

#startMenu {
  display: none;
  position: fixed;
  bottom: 65px;
  left: 10px;
  width: min(340px, calc(100vw - 20px));
  padding: 20px;
  border-radius: 15px;
  background: #15233aF5;
  backdrop-filter: blur(20px);
  z-index: 1001;
  box-shadow: 0 10px 40px #0007;
}

#startMenu h3 { margin-top: 0; }

.startitem {
  display: block;
  width: 100%;
  padding: 13px;
  color: white;
  background: transparent;
  border: 0;
  text-align: left;
  border-radius: 7px;
  font-size: 15px;
  cursor: pointer;
}

.startitem:hover { background: #ffffff20; }

.win {
  position: absolute;
  top: 12%;
  left: 10%;
  width: min(520px, 90vw);
  height: min(420px, 65vh);
  min-height: 220px;
  background: #f4f6fb;
  color: #172033;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 15px 50px #0008;
  display: flex;
  flex-direction: column;
}

.titlebar {
  height: 42px;
  flex-shrink: 0;
  background: #e4eaf5;
  display: flex;
  align-items: center;
  padding-left: 12px;
  font-size: 14px;
  cursor: move;
  gap: 8px;
}

.close {
  margin-left: auto;
  height: 42px;
  width: 45px;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
}

.close:hover { background: #e54848; color: white; }

.content {
  padding: 16px;
  overflow: auto;
  flex: 1;
}

.content input, .content textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd2df;
  border-radius: 6px;
  font: inherit;
  margin-bottom: 10px;
}

.content textarea {
  height: 220px;
  resize: vertical;
}

.content button {
  border: 0;
  padding: 10px 14px;
  border-radius: 6px;
  background: #1769d2;
  color: white;
  cursor: pointer;
  margin: 3px;
}

#calculatorDisplay {
  font-size: 28px;
  text-align: right;
  background: white;
  padding: 15px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.calcgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  margin-top: 10px;
}

.calcgrid button {
  margin: 0;
  min-height: 45px;
  font-size: 17px;
}

#browserFrame {
  background: white;
  color: #172033;
  padding: 12px;
  border-radius: 8px;
  min-height: 180px;
}

#browserFrame a { color: #1769d2; }

@media (max-width: 500px) {
  .win { left: 3%; width: 94vw; top: 10%; }
  .desktop { padding: 10px; }
}
</style>
</head>
<body>

<div class="desktop" id="desktop">
  <div class="icon" onclick="openApp('files')">
    <span class="emoji">📁</span>Arquivos
  </div>

  <div class="icon" onclick="openApp('notes')">
    <span class="emoji">📝</span>Bloco de notas
  </div>

  <div class="icon" onclick="openApp('calc')">
    <span class="emoji">🧮</span>Calculadora
  </div>

  <div class="icon" onclick="openApp('browser')">
    <span class="emoji">🌐</span>Navegador
  </div>

  <div class="icon" onclick="openApp('about')">
    <span class="emoji">⚙️</span>Configurações
  </div>
</div>

<div id="startMenu">
  <h3>🖥️ Meu PC Virtual</h3>
  <button class="startitem" onclick="openApp('browser')">🌐 Navegador</button>
  <button class="startitem" onclick="openApp('notes')">📝 Bloco de notas</button>
  <button class="startitem" onclick="openApp('calc')">🧮 Calculadora</button>
  <button class="startitem" onclick="openApp('files')">📁 Arquivos</button>
  <button class="startitem" onclick="openApp('about')">⚙️ Configurações</button>
  <button class="startitem" onclick="document.getElementById('startMenu').style.display='none'">Fechar menu</button>
</div>

<div class="taskbar">
  <button class="taskbutton" onclick="toggleStart()" title="Iniciar">⊞</button>
  <button class="taskbutton" onclick="openApp('browser')" title="Navegador">🌐</button>
  <button class="taskbutton" onclick="openApp('files')" title="Arquivos">📁</button>
  <button class="taskbutton" onclick="openApp('notes')" title="Notas">📝</button>
  <div id="clock"></div>
</div>

<script>
let topZ = 10;
let noteText = "";
let calcExpression = "";

function toggleStart() {
  const menu = document.getElementById("startMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function openApp(app) {
  document.getElementById("startMenu").style.display = "none";

  const old = document.getElementById("win-" + app);
  if (old) {
    old.style.display = "flex";
    old.style.zIndex = ++topZ;
    return;
  }

  const win = document.createElement("div");
  win.className = "win";
  win.id = "win-" + app;
  win.style.zIndex = ++topZ;
  win.style.left = Math.max(5, 10 + document.querySelectorAll(".win").length * 3) + "%";
  win.style.top = Math.max(5, 12 + document.querySelectorAll(".win").length * 3) + "%";

  const apps = {
    files: {
      title: "📁 Explorador de arquivos",
      html: `
        <h3>Meus arquivos</h3>
        <p>📂 Documentos</p>
        <p>🖼️ Imagens</p>
        <p>🎵 Músicas</p>
        <p>📥 Downloads</p>
        <p>Esta é uma pasta de demonstração.</p>`
    },
    notes: {
      title: "📝 Bloco de notas",
      html: `
        <textarea id="noteArea" placeholder="Escreva suas anotações..."></textarea>
        <button onclick="saveNote()">Salvar texto</button>
        <span id="noteStatus"></span>`
    },
    calc: {
      title: "🧮 Calculadora",
      html: `
        <div id="calculatorDisplay">0</div>
        <div class="calcgrid">
          ${["7","8","9","÷","4","5","6","×","1","2","3","-","C","0",".","+","(",")","⌫","="].map(
            key => `<button onclick="calcKey('${key}')">${key}</button>`
          ).join("")}
        </div>`
    },
    browser: {
      title: "🌐 Navegador virtual",
      html: `
        <form onsubmit="navigate(event)">
          <input id="address" placeholder="Digite um endereço, ex.: https://example.com">
          <button type="submit">Acessar</button>
        </form>
        <div id="browserFrame">
          <h3>Bem-vindo!</h3>
          <p>Digite um endereço para abrir um site.</p>
          <p>Alguns sites podem bloquear a abertura dentro de janelas incorporadas.</p>
        </div>`
    },
    about: {
      title: "⚙️ Configurações",
      html: `
        <h3>Meu PC Virtual</h3>
        <p>Sistema: PC Virtual Web</p>
        <p>Versão: 1.0</p>
        <p>Plataforma: navegador web</p>
        <hr>
        <h3>Papel de parede</h3>
        <button onclick="setWallpaper(1)">Azul</button>
        <button onclick="setWallpaper(2)">Roxo</button>
        <button onclick="setWallpaper(3)">Verde</button>
        <hr>
        <button onclick="if(confirm('Fechar todas as janelas?')) document.querySelectorAll('.win').forEach(w=>w.remove())">Fechar todos os aplicativos</button>`
    }
  };

  win.innerHTML = `
    <div class="titlebar">
      <span>${apps[app].title}</span>
      <button class="close" onclick="document.getElementById('win-${app}').remove()">×</button>
    </div>
    <div class="content">${apps[app].html}</div>
  `;

  win.addEventListener("pointerdown", () => {
    win.style.zIndex = ++topZ;
  });

  document.body.appendChild(win);
  makeDraggable(win);

  if (app === "notes") {
    document.getElementById("noteArea").value = noteText;
  }
}

function saveNote() {
  noteText = document.getElementById("noteArea").value;
  document.getElementById("noteStatus").textContent = " Texto salvo nesta sessão!";
}

function calcKey(key) {
  const display = document.getElementById("calculatorDisplay");
  if (!display) return;

  if (key === "C") {
    calcExpression = "";
    display.textContent = "0";
    return;
  }

  if (key === "⌫") {
    calcExpression = calcExpression.slice(0, -1);
    display.textContent = calcExpression || "0";
    return;
  }

  if (key === "=") {
    try {
      if (!calcExpression || !/^[0-9+\-*/().\s]+$/.test(calcExpression)) {
        throw new Error("Expressão inválida");
      }
      const result = Function('"use strict"; return (' + calcExpression + ')')();
      if (!Number.isFinite(result)) throw new Error("Resultado inválido");
      calcExpression = String(result);
      display.textContent = calcExpression;
    } catch {
      display.textContent = "Erro";
      calcExpression = "";
    }
    return;
  }

  const symbols = {"×":"*", "÷":"/"};
  calcExpression += symbols[key] || key;
  display.textContent = calcExpression;
}

function navigate(event) {
  event.preventDefault();
  const input = document.getElementById("address");
  const frame = document.getElementById("browserFrame");
  let address = input.value.trim();

  if (!address) return;

  if (!/^https?:\/\//i.test(address)) {
    address = "https://" + address;
  }

  try {
    const url = new URL(address);
    if (!["http:", "https:"].includes(url.protocol)) throw new Error();

    frame.innerHTML = `
      <h3>Site solicitado</h3>
      <p>${url.hostname.replace(/[&<>"']/g, "")}</p>
      <p>Por segurança, abra o site em uma nova aba:</p>
      <button id="openExternal">Abrir site</button>`;

    document.getElementById("openExternal").onclick = () => {
      window.open(url.href, "_blank", "noopener,noreferrer");
    };
  } catch {
    frame.textContent = "Endereço inválido.";
  }
}

function setWallpaper(type) {
  const backgrounds = {
    1: "radial-gradient(ellipse at 75% 30%, #1687d4, transparent 40%), linear-gradient(135deg,#07152f,#123c78,#07152f)",
    2: "radial-gradient(ellipse at 75% 30%, #b15cff, transparent 40%), linear-gradient(135deg,#170b35,#54208a,#100726)",
    3: "radial-gradient(ellipse at 75% 30%, #52db9a, transparent 40%), linear-gradient(135deg,#052e28,#14745a,#031d23)"
  };
  document.getElementById("desktop").style.background = backgrounds[type];
}

function makeDraggable(win) {
  const bar = win.querySelector(".titlebar");
  let startX, startY, startLeft, startTop, dragging = false;

  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = win.offsetLeft;
    startTop = win.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener("pointermove", e => {
    if (!dragging) return;
    win.style.left = Math.max(0, Math.min(
      window.innerWidth - win.offsetWidth,
      startLeft + e.clientX - startX
    )) + "px";
    win.style.top = Math.max(0, Math.min(
      window.innerHeight - 65,
      startTop + e.clientY - startY
    )) + "px";
  });

  bar.addEventListener("pointerup", () => dragging = false);
  bar.addEventListener("pointercancel", () => dragging = false);
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerHTML =
    now.toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"}) +
    "<br>" + now.toLocaleDateString("pt-BR");
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>

